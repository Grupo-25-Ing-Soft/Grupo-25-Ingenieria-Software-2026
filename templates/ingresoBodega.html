<!DOCTYPE html>
<html lang="es">
<head>
  <title>Ingreso a bodega - Comercial D Nix</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='app.css', v='4') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
{% include '_flash_toast.html' %}
{% include '_sidebar.html' %}
<header class="shared-topbar">
  <input class="shared-search" type="search" placeholder="Buscar en el sistema..." aria-label="Buscar en el sistema">
</header>

<div class="container-fluid">
  <div class="page-heading">
    <div>
      <div class="eyebrow">Operación / Producción</div>
      <h1>Ingreso a bodega</h1>
      <p>Registra en inventario las unidades de una guía de cortes.</p>
    </div>
  </div>

  <div class="data-card">
    <div class="data-card-header">
      <div>
        <h2>Ingresar producción</h2>
        <span>Selecciona la bodega destino y valida la guía de cortes.</span>
      </div>
    </div>
    <div class="modal-body">
      <form method="POST" action="{{ url_for('ingresoBodega') }}">
        <div class="mb-3">
          <label for="codigoCorte" class="form-label">Código de guía de cortes:</label>
          <input type="number" class="form-control" id="codigoCorte" name="codigoCorte" placeholder="Ingrese el código de corte" required>
        </div>
        <div class="mb-3">
          <label for="idBodega" class="form-label">Bodega destino:</label>
          <select class="form-select" id="idBodega" name="idBodega" required>
            <option value="" selected disabled>Seleccione una bodega</option>
            {% for bodega in bodegas %}
            <option value="{{ bodega.id_bodega }}">{{ bodega.descripcion }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary icon-button"><i class="bi bi-box-arrow-in-down" aria-hidden="true"></i><span>Ingresar a bodega</span></button>
          <a href="{{ url_for('produccion') }}" class="btn btn-outline-secondary icon-button"><i class="bi bi-arrow-left" aria-hidden="true"></i><span>Volver a Producción</span></a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
